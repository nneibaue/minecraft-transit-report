[project]
name = "turtle-helper"
version = "0.1.0"
description = "In-game LLM assistant bridge for Minecraft ATM9 (CC:Tweaked + Advanced Peripherals)"
requires-python = ">=3.12"
dependencies = [
    "websockets==17.1",
    "anthropic==1.7.0",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "ruff==0.5.1",
    "mypy==1.14.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
